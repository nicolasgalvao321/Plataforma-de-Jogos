<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Plataforma de Jogos</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #3d7ddf, #1c3f7a);
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* HEADER */
header {
    display: flex;
    align-items: center;
    justify-content: center; /* centraliza tudo */
    padding: 15px 30px;
    background-color: #151324;
    color: white;
    gap: 15px;
    text-align: center;
}

header img {
    width: 60px;
}

header h1 {
    font-size: 24px;
}

/* LAYOUT PRINCIPAL */
.container {
    display: flex;
    flex: 1;
    height: 100%;
}

/* MENU LATERAL */
.sidebar {
    width: 220px;
    background-color: #151324;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: center; /* centraliza os botões */
}

.sidebar a {
    text-decoration: none;
    color: white;
    padding: 12px;
    background-color: #2a2a4a;
    border-radius: 8px;
    transition: 0.3s;
    text-align: center;
    width: 100%;
    max-width: 180px;
}

.sidebar a:hover {
    background-color: #3d7ddf;
    transform: scale(1.05);
}

/* ÁREA DO JOGO */
.main {
    width: 1000px;
    height: 700px;
    padding: 0;
    
}

iframe {
    width: 90%
    height: 90%;
    max-width: 1000px:
    max-height: 600px
    border-radius: 10px;
    border: none;
    background-color: white;
}

/* RESPONSIVO */
@media(max-width: 768px) {
    .container {
        flex-direction: column;
    }

    .sidebar {
        flex-direction: row;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
    }

    .sidebar a {
        max-width: 140px;
    }
}
</style>
</head>

<body>

<header>
    <img src="https://i.ibb.co/CKjDQz4K/925b9f8d-0553-46c6-aa9e-21b2ec18e59c-2.png">
    <h1>Plataforma de Jogos</h1>
</header>

<div class="container">

    <div class="sidebar">
        <a href="#" onclick="mostrarPagina('https://nicolasgalvao321.github.io/JogoDaVelha/')">Jogo da Velha</a>
        <a href="#" onclick="mostrarPagina('https://nicolasgalvao321.github.io/Jogo-do-Carrinho/')">Jogo do Carrinho</a>
        <a href="#" onclick="mostrarPagina('https://nicolasgalvao321.github.io/Arkanoid/')">Arkanoid</a>
        <a href="#" onclick="mostrarPagina('https://docs.google.com/forms/d/e/1FAIpQLSdsKJWPVX8kP0nCMRhS9oBHz5M2S50NvjuyscwX_AyW9Mn4hQ/viewform?usp=publish-editor')">Feedback</a>
    </div>

    <div class="main">
        <iframe id="frame"></iframe>
    </div>

</div>

<script>
function mostrarPagina(url) {
    document.getElementById("frame").src = url;
}
</script>

</body>
</html>
