<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Plataforma de Jogos</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #3d7ddf, #1c3f7a);
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */
header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px 30px;
    background-color: #151324;
    color: white;
    gap: 15px;
    border-bottom: 2px solid #FFFFFF
}

/* LAYOUT */
.container {
    display: flex;
    flex: 1;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    background-color: #151324;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: center;
    border-right: 2px solid #FFFFFF
}

.sidebar a {
    text-decoration: none;
    color: white;
    padding: 12px;
    background-color: #2a2a4a;
    border-radius: 8px;
    transition: 0.3s;
    text-align: center;
    width: 100%;
    max-width: 180px;
}


/* ÁREA DO JOGO */
.main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* CONTAINER DO JOGO */
.game-container {
    width: 1200px;
    height: 900px;
}

/* IFRAME */
iframe {
    width: 100%;
    height: 100%;
    border-radius: 10px;
    border: none;
    background-color: white;
    overflow: hidden;
}

/* BOTÃO FULLSCREEN */
.fullscreen-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #151324;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

.fullscreen-btn:hover {
    background: #3d7ddf;
}

/* RESPONSIVO */
@media(max-width: 768px) {
    .container {
        flex-direction: column;
    }

    .sidebar {
        flex-direction: row;
        width: 100%;
        flex-wrap: wrap;
        justify-content: center;
    }

    .game-container {
        width: 95%;
        height: 60vh;
    }
}
</style>
</head>

<body>

<header>
    <img src="https://i.ibb.co/CKjDQz4K/925b9f8d-0553-46c6-aa9e-21b2ec18e59c-2.png" width="60">
    <h1>Plataforma de Jogos</h1>
</header>

<div class="container">

    <div class="sidebar">
        <a href="#" onclick="mostrarPagina('https://nicolasgalvao321.github.io/JogoDaVelha/')">Jogo da Velha</a>
        <a href="#" onclick="mostrarPagina('https://nicolasgalvao321.github.io/Jogo-do-Carrinho/')">Jogo do Carrinho</a>
        <a href="#" onclick="mostrarPagina('https://nicolasgalvao321.github.io/Arkanoid/')">Arkanoid</a>
        <a href="#" onclick="mostrarPagina('https://docs.google.com/forms/d/e/1FAIpQLSdsKJWPVX8kP0nCMRhS9oBHz5M2S50NvjuyscwX_AyW9Mn4hQ/viewform?usp=publish-editor')">Feedback</a>
    </div>

    <div class="main">
        <div class="game-container" id="gameContainer">
            <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Tela Cheia</button>
            <iframe id="frame"></iframe>
        </div>
    </div>

</div>

<script>
function mostrarPagina(url) {
    document.getElementById("frame").src = url;
}

// Tela cheia
function toggleFullScreen() {
    let elem = document.getElementById("gameContainer");

    if (!document.fullscreenElement) {
        elem.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}
</script>

</body>
</html>
